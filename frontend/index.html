  <script>
    // The app looks like «Сейчас». A link with ?design=journal|route|base switches this device to another
    // look (base is the look before the designs) and is remembered; ?design= returns to «Сейчас».
    var design = "now";
    try {
      var asked = new URLSearchParams(location.search).get("design");
      if (asked) localStorage.setItem("look", asked);
      else if (asked !== null) localStorage.removeItem("look");
      design = localStorage.getItem("look") || design;
    } catch (e) {}
    document.documentElement.dataset.design = design;
  </script>
